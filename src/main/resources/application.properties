spring.application.name=ms-notification
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- RabbitMQ (clúster de 2 nodos) ---
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# --- Kafka (clúster de 3 brokers) ---
# Dos grupos de consumidores independientes: analítica (ambos tópicos) y alertas (eventos de atenciones).
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topic.atenciones-eventos=vidasalud.atenciones.eventos
app.kafka.topic.catalogo-cupos=vidasalud.catalogo.cupos
app.kafka.group.analitica=vidasalud-analitica
app.kafka.group.alertas=vidasalud-alertas
app.kafka.consumer.concurrency=3
app.kafka.consumer.retry-interval-ms=1000
app.kafka.consumer.retry-attempts=3
